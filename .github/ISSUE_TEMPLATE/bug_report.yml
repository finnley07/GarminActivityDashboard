name: Bug report
description: Something is broken or not working as expected
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** paste Garmin passwords or `data/app-config.json` contents.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: Sync fails after clicking Load data…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run dev`
        2. Open Settings
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Node.js version
      placeholder: v22.18.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Terminal output from API or browser console (redact credentials).
      render: shell
